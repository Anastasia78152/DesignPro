{% extends "portal/base.html" %}
{% block content %}
<h2>Смена статуса для: {{ req.title }}</h2>
<p>Текущий статус: <strong>{{ req.get_status_display }}</strong></p>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить изменения</button>
    <a href="{% url 'admin_dashboard' %}" class="btn">Отмена</a>
</form>
{% endblock %}
