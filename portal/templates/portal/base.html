<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Design.pro{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <h1><a href="{% url 'index' %}" style="color:white; text-decoration:none;">Design.pro</a></h1>
        <nav>
            {% if user.is_authenticated %}
            <a href="{% url 'user_dashboard' %}">Мои заявки</a>
            {% if user.is_staff %}
            <a href="{% url 'admin_dashboard' %}">Админ-панель</a>
            {% endif %}
            <a href="{% url 'user_logout' %}">Выход ({{ user.username }})</a>
            {% else %}
            <a href="{% url 'user_login' %}">Вход</a>
            <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
